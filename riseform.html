<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riseform — vista previa</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111;
        --card: #1a1a1a;
        --border: #333;
        --muted: #888;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #eee;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
        align-items: start;
      }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      figcaption {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }
      figure.cover {
        grid-column: 1 / -1;
        max-width: 100%;
      }
      figure.cover img {
        max-height: 320px;
        object-fit: contain;
        background: #000;
      }
      .hint {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Riseform — perfil y portada estilo hook</h1>
    <p class="hint">
      Perfil y portada: <strong>Playfair Display</strong>, mismo relleno cromo/líquido que <code>style_hook</code>.
      Variantes clásicas minimal y perfil/cover “marca” están en
      <a href="rnd-word.html">rnd-word.html</a>. Ejecuta <code>npm run generate-images</code>.
    </p>
    <div class="grid">
      <figure>
        <img src="generated/riseform_profile.png" alt="riseform_profile" />
        <figcaption>riseform_profile — Playfair / Riseform (como style_hook)</figcaption>
      </figure>
      <figure class="cover">
        <img src="generated/riseform_cover.png" alt="riseform_cover" />
        <figcaption>riseform_cover — Playfair / misma frase (relleno como style_hook)</figcaption>
      </figure>
    </div>
  </body>
</html>
