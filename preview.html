<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vista previa — imágenes generadas</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111;
        --card: #1a1a1a;
        --border: #333;
        --muted: #888;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #eee;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
        align-items: start;
      }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      figcaption {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }
      figure.cover {
        grid-column: 1 / -1;
        max-width: 100%;
      }
      figure.cover img {
        max-height: 320px;
        object-fit: contain;
        background: #000;
      }
      .hint {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Imágenes generadas</h1>
    <p class="hint">
      Motivation (profile/cover clásicos + estilos): <a href="motivation-preview.html">motivation-preview.html</a>.
      Aquí abajo, profile/cover con identidad marca (gradiente + glow). Ejecuta
      <code>npm run generate-images</code> si no ves las imágenes (carpeta <code>generated/</code>).
    </p>
    <div class="grid">
      <figure>
        <img src="generated/profile_photo_preview.png" alt="profile marca" />
        <figcaption>profile_photo_preview (marca)</figcaption>
      </figure>
      <figure class="cover">
        <img src="generated/cover_photo_preview.png" alt="cover marca" />
        <figcaption>cover_photo_preview (marca, más ancha)</figcaption>
      </figure>
      <figure>
        <img src="generated/hook_photo_azul.png" alt="hook azul" />
        <figcaption>hook_photo — azul (WORD)</figcaption>
      </figure>
      <figure>
        <img src="generated/short_definition_dinero.png" alt="short_definition_dinero" />
        <figcaption>short_definition — Dinero</figcaption>
      </figure>
      <figure>
        <img src="generated/extra_value_dinero.png" alt="extra_value_dinero" />
        <figcaption>extra_value — Money</figcaption>
      </figure>
      <figure>
        <img src="generated/hook_photo_verde.png" alt="hook verde neón" />
        <figcaption>hook_photo — verde neón (WORD)</figcaption>
      </figure>
      <figure>
        <img src="generated/short_definition_ia.png" alt="short_definition_ia" />
        <figcaption>short_definition — IA</figcaption>
      </figure>
      <figure>
        <img src="generated/extra_value_ia.png" alt="extra_value_ia" />
        <figcaption>extra_value — AI</figcaption>
      </figure>
      <figure>
        <img src="generated/hook_photo_morado.png" alt="hook morado" />
        <figcaption>hook_photo — morado (WORD)</figcaption>
      </figure>
      <figure>
        <img src="generated/short_definition_psicologia.png" alt="short_definition_psicologia" />
        <figcaption>short_definition — Psicologia</figcaption>
      </figure>
      <figure>
        <img src="generated/extra_value_psicologia.png" alt="extra_value_psicologia" />
        <figcaption>extra_value — Psychology</figcaption>
      </figure>
      <figure>
        <img src="generated/hook_photo_naranja.png" alt="hook naranja" />
        <figcaption>hook_photo — naranja (WORD)</figcaption>
      </figure>
      <figure>
        <img src="generated/short_definition_cultura.png" alt="short_definition_cultura" />
        <figcaption>short_definition — Cultura</figcaption>
      </figure>
      <figure>
        <img src="generated/extra_value_cultura.png" alt="extra_value_cultura" />
        <figcaption>extra_value — Culture</figcaption>
      </figure>
      <figure>
        <img src="generated/hook_photo_rojo.png" alt="hook rojo" />
        <figcaption>hook_photo — rojo (WORD)</figcaption>
      </figure>
      <figure>
        <img src="generated/short_definition_relaciones.png" alt="short_definition_relaciones" />
        <figcaption>short_definition — Relaciones</figcaption>
      </figure>
      <figure>
        <img src="generated/extra_value_relaciones.png" alt="extra_value_relaciones" />
        <figcaption>extra_value — Relationships</figcaption>
      </figure>
    </div>
  </body>
</html>
